<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casos de Estudio – Estrategia de Inversión</title>
  <style>
/* ── Reset ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }

/* ── Tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:        #0b0e1a;
  --surface:   #131729;
  --card:      #1a1f35;
  --card-hi:   #1f2540;
  --inp:       #0f1220;
  --border:    #252d4a;
  --border-hi: #4f7ef7;
  --accent:    #4f7ef7;
  --accent-d:  #3060d0;
  --green:     #22c55e;
  --green-d:   #14532d;
  --red:       #ef4444;
  --red-d:     #7f1d1d;
  --amber:     #f59e0b;
  --amber-d:   #78350f;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --sec:       #94a3b8;
  --r:         10px;
  --shadow:    0 8px 32px rgba(0,0,0,.55);
}

/* ── Base ───────────────────────────────────────────────────────── */
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; line-height: 1.5;
}

/* ── Header ─────────────────────────────────────────────────────── */
.hdr {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50; gap: 12px;
}
.logo { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.logo em { color: var(--sec); font-style: normal; font-weight: 400; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 16px; border: none; border-radius: var(--r);
  font: 600 13px 'Segoe UI', sans-serif; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.btn-primary  { background: var(--accent);  color: #fff; }
.btn-primary:hover  { background: var(--accent-d); }
.btn-ghost    { background: transparent; color: var(--sec); border: 1px solid var(--border); }
.btn-ghost:hover    { color: var(--text); background: var(--card); }
.btn-success  { background: var(--green-d); color: var(--green); border: 1px solid #166534; }
.btn-success:hover  { background: var(--green); color: #fff; }
.btn-warning  { background: var(--amber-d); color: var(--amber); border: 1px solid #92400e; }
.btn-warning:hover  { background: var(--amber); color: #fff; }
.btn-danger   { background: var(--red-d);   color: var(--red);   border: 1px solid #991b1b; }
.btn-danger:hover   { background: var(--red);   color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-xs { padding: 3px 8px;  font-size: 11px; border-radius: 6px; }

/* ── Main ────────────────────────────────────────────────────────── */
#main { max-width: 1300px; margin: 0 auto; padding: 24px; }

/* ── Tabs ────────────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--border);
  margin-bottom: 24px;
}
.tab-btn {
  padding: 10px 22px; background: transparent; border: none; border-bottom: 3px solid transparent;
  color: var(--muted); cursor: pointer; font: 600 13px 'Segoe UI', sans-serif;
  margin-bottom: -2px; transition: all .15s; white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--border); color: var(--muted); border-radius: 20px;
  font-size: 10px; font-weight: 700; padding: 1px 7px; margin-left: 6px;
}
.tab-btn.active .tab-badge { background: rgba(79,126,247,.2); color: var(--accent); }

/* ── Cards grid ─────────────────────────────────────────────────── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px; margin-top: 20px;
}
.case-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; cursor: pointer; transition: all .15s ease;
}
.case-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.cc-img { width: 100%; height: 150px; object-fit: cover; background: var(--inp); display: block; }
.cc-no-img {
  width: 100%; height: 150px; background: var(--inp);
  display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--muted);
}
.cc-body { padding: 14px 16px; }
.cc-title { font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.cc-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  border: 1px solid; text-transform: uppercase; letter-spacing: .3px;
}
.b-blue   { background: rgba(79,126,247,.1); color: var(--accent); border-color: var(--accent); }
.b-green  { background: rgba(34,197,94,.1);  color: var(--green);  border-color: var(--green);  }
.b-amber  { background: rgba(245,158,11,.1); color: var(--amber);  border-color: var(--amber);  }
.b-red    { background: rgba(239,68,68,.1);  color: var(--red);    border-color: var(--red);    }
.cc-stats { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
.mini-stat { display: flex; flex-direction: column; gap: 1px; }
.mini-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.mini-val   { font-size: 14px; font-weight: 700; }

/* ── Empty ───────────────────────────────────────────────────────── */
.empty { text-align: center; padding: 80px 24px; color: var(--muted); }
.empty .icon { font-size: 56px; margin-bottom: 16px; }
.empty h2 { font-size: 20px; color: var(--sec); margin-bottom: 8px; }

/* ── Form sections ───────────────────────────────────────────────── */
.section {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px 24px; margin-bottom: 16px;
}
.sec-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--sec); border-bottom: 1px solid var(--border);
  padding-bottom: 10px; margin-bottom: 18px;
}

/* ── Form fields ─────────────────────────────────────────────────── */
.fgrid  { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.fgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg.span2 { grid-column: 1 / -1; }
label { font-size: 11px; font-weight: 700; color: var(--sec); text-transform: uppercase; letter-spacing: .4px; }
input, select, textarea {
  background: var(--inp); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font: 13px 'Segoe UI', sans-serif; padding: 9px 11px; width: 100%; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-hi); }
input[readonly], textarea[readonly] { opacity: .55; cursor: default; }
textarea { resize: vertical; min-height: 72px; }
select option { background: var(--surface); }
.hint {
  font-size: 11px; color: var(--amber); background: rgba(245,158,11,.07);
  border: 1px solid rgba(245,158,11,.2); border-radius: 6px; padding: 5px 10px; margin-top: 3px; line-height: 1.6;
}

/* ── Lock banner ─────────────────────────────────────────────────── */
.lock-banner {
  background: rgba(245,158,11,.07); border: 1px solid rgba(245,158,11,.25);
  border-radius: var(--r); padding: 12px 18px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px; color: var(--amber); font-size: 13px;
}
.lock-banner strong { font-weight: 700; }

/* ── Image upload ────────────────────────────────────────────────── */
.img-zone {
  border: 2px dashed var(--border); border-radius: var(--r);
  padding: 28px; text-align: center; cursor: pointer; transition: all .15s;
}
.img-zone:hover, .img-zone.drag-over { border-color: var(--accent); background: rgba(79,126,247,.04); }
.img-zone.locked { cursor: default; }
.img-zone.locked:hover { border-color: var(--border); background: transparent; }
.img-zone img { max-width: 100%; max-height: 280px; border-radius: 8px; object-fit: contain; }
.img-zone-txt { color: var(--muted); font-size: 13px; }
.img-zone-txt strong { color: var(--accent); }

/* ── Position tracker ────────────────────────────────────────────── */
.pos-tracker {
  background: var(--inp); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 16px;
}
.pt-item { display: flex; flex-direction: column; gap: 2px; }
.pt-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.pt-val   { font-size: 16px; font-weight: 800; }

/* ── Operations ──────────────────────────────────────────────────── */
.ops-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.op-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
}
.op-card.t-exit  { border-left: 3px solid var(--green); }
.op-card.t-add   { border-left: 3px solid var(--accent); }
.op-card.t-final { border-left: 3px solid var(--amber); }
.op-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.op-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
.t-exit  .op-lbl { color: var(--green); }
.t-add   .op-lbl { color: var(--accent); }
.t-final .op-lbl { color: var(--amber); }
.op-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── 5th candle note ─────────────────────────────────────────────── */
.vela-note {
  font-size: 11px; color: var(--amber); background: rgba(245,158,11,.06);
  border: 1px solid rgba(245,158,11,.18); border-radius: 6px; padding: 5px 10px; margin-top: 8px;
}

/* ── Summary ─────────────────────────────────────────────────────── */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
.sum-stat { display: flex; flex-direction: column; gap: 4px; }
.sum-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.sum-val   { font-size: 22px; font-weight: 800; line-height: 1.2; }
.sum-sub   { font-size: 11px; color: var(--muted); }

/* ── Colors ──────────────────────────────────────────────────────── */
.pos { color: var(--green); }
.neg { color: var(--red); }
.neu { color: var(--text); }

/* ── Back nav ────────────────────────────────────────────────────── */
.back-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.back-nav h1 { font-size: 20px; font-weight: 800; }

/* ── Toast ───────────────────────────────────────────────────────── */
#toasts { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 16px; font-size: 13px; box-shadow: var(--shadow); animation: toastin .2s ease;
}
.toast.ok  { border-left: 3px solid var(--green); }
.toast.err { border-left: 3px solid var(--red); }
@keyframes toastin { from { transform: translateX(110%); opacity:0; } to { transform:none; opacity:1; } }

/* ── Date picker ─────────────────────────────────────────────────── */
input[type="date"] { color-scheme: dark; }

/* ── Lightbox ────────────────────────────────────────────────────── */
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.92);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  cursor: zoom-out; animation: lbin .15s ease;
}
.lightbox img { max-width: 95vw; max-height: 92vh; object-fit: contain; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,.8); }
.lightbox-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; opacity: .7; line-height: 1; }
.lightbox-close:hover { opacity: 1; }
@keyframes lbin { from { opacity:0; } to { opacity:1; } }

/* ── Dashboard stats bar ─────────────────────────────────────────── */
.dash-stats {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
  gap: 12px; margin-bottom: 20px;
}
.ds-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 3px;
}
.ds-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.ds-val   { font-size: 20px; font-weight: 800; }
.ds-sub   { font-size: 11px; color: var(--muted); }

/* ── Filter bar ─────────────────────────────────────────────────── */
.filter-bar {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px;
}
.filter-bar input[type="text"] { flex: 1; min-width: 160px; }
.filter-bar select { width: auto; }
.view-toggle { display: flex; gap: 2px; margin-left: auto; }
.view-toggle button {
  background: var(--inp); border: 1px solid var(--border); color: var(--muted);
  padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 15px;
  transition: all .15s; line-height: 1;
}
.view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Table view ─────────────────────────────────────────────────── */
.cases-table {
  width: 100%; border-collapse: collapse; background: var(--card);
  border-radius: var(--r); overflow: hidden; border: 1px solid var(--border);
}
.cases-table thead tr { background: var(--surface); border-bottom: 2px solid var(--border); }
.cases-table th {
  padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
  white-space: nowrap; cursor: pointer; user-select: none;
}
.cases-table th:hover { color: var(--text); }
.cases-table th.sorted { color: var(--accent); }
.cases-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.cases-table tr:last-child td { border-bottom: none; }
.cases-table tbody tr { cursor: pointer; transition: background .1s; }
.cases-table tbody tr:hover { background: var(--card-hi); }
.sort-arr { font-size: 10px; margin-left: 3px; opacity: .4; }
.sorted .sort-arr { opacity: 1; }
.no-results { text-align:center; padding: 48px; color: var(--muted); font-size: 14px; }

/* ── En Seguimiento – list ───────────────────────────────────────── */
.open-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.open-row {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 18px; display: flex; align-items: center; gap: 16px;
  cursor: pointer; transition: all .15s;
}
.open-row:hover { border-color: var(--accent); background: var(--card-hi); }
.open-row .or-asset { font-size: 16px; font-weight: 800; min-width: 70px; }
.open-row .or-meta  { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
.open-row .or-right { display: flex; gap: 12px; align-items: center; margin-left: auto; }
.open-row .or-pnl   { font-weight: 700; font-size: 14px; }

/* ── Pending-validation banner ───────────────────────────────────── */
.pending-banner {
  background: rgba(79,126,247,.07); border: 1px solid rgba(79,126,247,.3);
  border-radius: var(--r); padding: 12px 18px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 13px;
  flex-wrap: wrap;
}
.pending-banner strong { font-weight: 700; }

/* ── Modal ───────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.72);
  z-index: 600; display: flex; align-items: center; justify-content: center;
  animation: lbin .15s ease;
}
.modal-box {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 28px 30px; width: 420px; max-width: 92vw; box-shadow: var(--shadow);
}
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 10px; }
.modal-body  { font-size: 13px; color: var(--sec); line-height: 1.6; margin-bottom: 18px; }
.modal-body strong { color: var(--text); }
.modal-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
.modal-field label { font-size: 11px; font-weight: 700; color: var(--sec); text-transform: uppercase; letter-spacing: .4px; }
.modal-field input {
  background: var(--inp); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font: 14px 'Segoe UI', sans-serif; padding: 10px 12px;
  letter-spacing: .08em;
}
.modal-field input:focus { outline: none; border-color: var(--border-hi); }
.modal-field input.err   { border-color: var(--red); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

/* ── Responsive ──────────────────────────────────────────────────── */
@media (max-width:600px) {
  #main { padding: 12px; }
  .fgrid, .fgrid2 { grid-template-columns: 1fr; }
  .hdr { flex-wrap: wrap; }
}
  </style>

</head>
<body>

<header class="hdr">
  <div class="logo">📊 Casos de Estudio <em>— Estrategia de Inversión</em></div>
  <div id="hdr-actions"></div>
</header>

<div id="main"></div>
<div id="toasts"></div>
<input type="file" id="import-input" accept=".json" style="display:none" data-action="import-file">

<script>
// ══════════════════════════════════════════════════════════════════
//  STATE & PERSISTENCE
// ══════════════════════════════════════════════════════════════════
const KEY        = 'inv_cases_v1';
const AUTHOR_KEY = 'inv_author_name';
const ADMIN_PIN  = '1987';  // ← cambia este PIN

// ── Firebase (configura aquí para sincronizar con la comunidad) ────
// 1. Ve a https://console.firebase.google.com y crea un proyecto
// 2. En Firestore Database → Crear base de datos → modo producción
// 3. En Configuración del proyecto → Tus apps → Web → Copia la config
// 4. Pega los valores aquí y despliega en GitHub Pages o Firebase Hosting
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyAS-d5HIrN9iKYbqbNFnDJnCzRMug3cs9M',
  authDomain:        'comunidadinversores-b9046.firebaseapp.com',
  projectId:         'comunidadinversores-b9046',
  storageBucket:     'comunidadinversores-b9046.firebasestorage.app',
  messagingSenderId: '425271183881',
  appId:             '1:425271183881:web:3c34257b31f65a01e406d8'
};
const FIREBASE_READY = FIREBASE_CONFIG.projectId !== 'YOUR_PROJECT_ID';
let db = null;

const S = {
  view:      'list',   // 'list' | 'form'
  cases:     [],
  editing:   null,
  listTab:   'db',     // 'db' | 'pending' | 'open' | 'discarded'
  listView:  'cards',
  filter:    { search: '', timeframe: 'all', year: 'all' },
  sort:      'entry_desc',
  adminMode: false,    // admin ha desbloqueado el caso actual para editar
};

function load()         { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function persistLocal() { localStorage.setItem(KEY, JSON.stringify(S.cases)); }
function persist()      { persistLocal(); }   // alias backward-compat
function getDefaultAuthor()  { return localStorage.getItem(AUTHOR_KEY) || ''; }
function saveDefaultAuthor(n){ if (n && n.trim()) localStorage.setItem(AUTHOR_KEY, n.trim()); }

// ── Firebase helpers ──────────────────────────────────────────────
function firestoreSave(c) {
  if (!db) return;
  db.collection('cases').doc(c.id).set(c)
    .catch(e => { console.warn('Firestore save:', e); toast('⚠️ Error de sincronización', 'err'); });
}
function firestoreDelete(caseId) {
  if (!db) return;
  db.collection('cases').doc(caseId).delete()
    .catch(e => console.warn('Firestore delete:', e));
}
function updateSyncStatus(state) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    online:  ['🟢', 'Sincronizado',    'var(--green)'],
    offline: ['🔴', 'Sin conexión',    'var(--red)'],
    syncing: ['🔄', 'Sincronizando…',  'var(--amber)'],
  };
  const [icon, text, color] = map[state] || map.offline;
  el.innerHTML = `${icon} <span style="color:${color};font-weight:600">${text}</span>`;
}
function initFirebase() {
  if (!FIREBASE_READY) return;
  // Carga dinámica: solo si Firebase está configurado (evita bloquear la carga en modo local)
  const loadScript = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js')
    .then(() => loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'))
    .then(() => {
      try {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        setupSync();
      } catch(e) { console.warn('Firebase init error:', e); }
    })
    .catch(e => console.warn('No se pudo cargar Firebase SDK:', e));
}
function setupSync() {
  if (!db) return;
  let firstSnap = true;
  db.collection('cases').onSnapshot(snap => {
    const localImg = {};
    S.cases.forEach(c => { if (c.image) localImg[c.id] = c.image; });

    // Primera sincronización: si Firestore está vacío pero hay datos locales → subirlos
    if (firstSnap && snap.empty && S.cases.length > 0) {
      firstSnap = false;
      const batch = db.batch();
      S.cases.forEach(c => batch.set(db.collection('cases').doc(c.id), c));
      batch.commit().catch(e => console.warn('Initial upload error:', e));
      updateSyncStatus('online');
      return;
    }
    firstSnap = false;

    S.cases = [];
    snap.forEach(doc => {
      const c = { ...doc.data(), id: doc.id };
      if (!c.image && localImg[c.id]) c.image = localImg[c.id];
      S.cases.push(c);
    });
    S.cases.forEach(c => {
      if (!c.status) {
        if (c.validated === true) c.status = 'published';
        else if (isClosed(c))    c.status = 'pending';
        else                      c.status = 'open';
      }
    });
    persistLocal();
    if (S.view === 'list') render();
    updateSyncStatus('online');
  }, err => {
    console.warn('Firestore listener error:', err);
    updateSyncStatus('offline');
  });
}

//  MODAL (reemplaza prompt/confirm nativos — bloqueados en iframes)
// ══════════════════════════════════════════════════════════════════
function showModal({ title, body='', inputType=null, inputLabel='', placeholder='',
                     confirmLabel='Confirmar', danger=false, onConfirm, onCancel=null }) {
  document.getElementById('app-modal')?.remove();

  const m = document.createElement('div');
  m.id = 'app-modal';
  m.className = 'modal-overlay';
  m.innerHTML = `
    <div class="modal-box" id="modal-box">
      <div class="modal-title">${title}</div>
      ${body ? `<div class="modal-body">${body}</div>` : ''}
      ${inputType ? `
        <div class="modal-field">
          ${inputLabel ? `<label>${inputLabel}</label>` : ''}
          <input id="modal-inp" type="${inputType}" autocomplete="off" placeholder="${placeholder}">
        </div>` : ''}
      <div class="modal-btns">
        <button class="btn btn-ghost btn-sm" id="modal-cancel">Cancelar</button>
        <button class="btn btn-sm ${danger?'btn-danger':'btn-primary'}" id="modal-ok">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(m);

  const inp  = document.getElementById('modal-inp');
  const okB  = document.getElementById('modal-ok');
  const canB = document.getElementById('modal-cancel');
  if (inp) { inp.focus(); }

  const close = () => m.remove();

  okB.addEventListener('click', () => {
    const val = inp ? inp.value.trim() : null;
    if (inputType && !val) { inp.classList.add('err'); inp.focus(); return; }
    close(); onConfirm(val);
  });
  canB.addEventListener('click', () => { close(); onCancel?.(); });
  m.addEventListener('click', e => { if (e.target === m) { close(); onCancel?.(); } });
  if (inp) {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') okB.click();
      if (e.key === 'Escape') canB.click();
    });
  } else {
    const esc = e => { if (e.key === 'Escape') { canB.click(); document.removeEventListener('keydown', esc); } };
    document.addEventListener('keydown', esc);
  }
}

// ══════════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════════
function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function num(v, d = 2) {
  const n = parseFloat(v); if (isNaN(n)) return '—';
  return n.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function eur(v, sign = true) {
  const n = parseFloat(v); if (isNaN(n)) return '—';
  const abs = Math.abs(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (!sign) return abs + ' €';
  return (n >= 0 ? '+' : '−') + abs + ' €';
}
function pct(v) {
  const n = parseFloat(v); if (isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}
function cls(n) { return parseFloat(n) >= 0 ? 'pos' : 'neg'; }
function isClosed(c)  { return (c.operations || []).some(o => o.type === 'final_exit'); }
function caseStatus(c) {
  if (c.status) return c.status;
  // Migración desde campo legacy `validated`
  if (c.validated === true) return 'published';
  if (isClosed(c)) return 'pending';
  return 'open';
}
function isPublished(c)  { return caseStatus(c) === 'published'; }
function isPending(c)    { return caseStatus(c) === 'pending'; }
function isOpenCase(c)   { return caseStatus(c) === 'open'; }
function isDiscarded(c)  { return caseStatus(c) === 'discarded'; }

function toast(msg, type = 'ok') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ══════════════════════════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════════════════════════
function sharesFormula(account, price, sl) {
  const risk = parseFloat(account) * 0.01;
  const dist = Math.abs(parseFloat(price) - parseFloat(sl));
  if (!dist) return null;
  return risk / dist;
}
function sharesHintText(account, price, sl) {
  const risk = parseFloat(account) * 0.01;
  const dist = Math.abs(parseFloat(price) - parseFloat(sl));
  const calc = dist ? risk / dist : 0;
  return `Riesgo 1%: ${eur(risk, false)} | Distancia SL: ${num(dist)} € | Calculado: ${num(calc, 3)} acc. → recomendado: ${Math.floor(calc)} acc.`;
}
function calcInitialRisk(c) {
  const price = parseFloat(c.entryPrice), sl = parseFloat(c.entrySL), shares = parseFloat(c.entryShares);
  if (!price || !sl || !shares) return null;
  return Math.abs(price - sl) * shares;
}
function calcRR(c) {
  const risk = calcInitialRisk(c);
  const pos  = positionState(c);
  if (!risk) return null;
  return pos.realizedPnL / risk;
}
function calcAssetReturn(c) {
  const exits = (c.operations||[]).filter(o =>
    (o.type==='partial_exit'||o.type==='final_exit') && +o.price>0 && +o.shares>0);
  if (!exits.length || !(+c.entryPrice > 0)) return null;
  const totalProceeds = exits.reduce((s,o) => s + (+o.price)*(+o.shares), 0);
  const totalShares   = exits.reduce((s,o) => s + (+o.shares), 0);
  const avgExit = totalProceeds / totalShares;
  return (avgExit - +c.entryPrice) / +c.entryPrice * 100;
}

function fmtRR(rr) {
  if (rr == null || isNaN(rr)) return '—';
  return (rr >= 0 ? '+' : '−') + Math.abs(rr).toFixed(2) + ' R';
}

function positionState(c, upTo = Infinity) {
  let lots = [], realized = 0;
  if (parseFloat(c.entryPrice) > 0 && parseFloat(c.entryShares) > 0)
    lots.push({ price: +c.entryPrice, shares: +c.entryShares });

  for (const op of (c.operations || []).slice(0, upTo)) {
    const tot = lots.reduce((s,l)=>s+l.shares, 0);
    const cos = lots.reduce((s,l)=>s+l.price*l.shares, 0);
    if (op.type === 'add') {
      if (+op.price > 0 && +op.shares > 0) lots.push({ price: +op.price, shares: +op.shares });
    } else if (op.type === 'partial_exit' || op.type === 'final_exit') {
      if (tot > 0 && +op.price > 0 && +op.shares > 0) {
        const avg = cos / tot, sold = Math.min(+op.shares, tot);
        realized += (+op.price - avg) * sold;
        const ratio = sold / tot;
        lots = lots.map(l => ({ price: l.price, shares: l.shares * (1 - ratio) })).filter(l => l.shares > 0.0005);
      }
    }
  }
  const ts = lots.reduce((s,l)=>s+l.shares, 0);
  const tc = lots.reduce((s,l)=>s+l.price*l.shares, 0);
  return { lots, totalShares: ts, avgCost: ts > 0 ? tc/ts : 0, realizedPnL: realized };
}

// ══════════════════════════════════════════════════════════════════
function setListTab(tab) { S.listTab = tab; render(); }
function filterSearch(v)  { S.filter.search = v.toLowerCase(); renderListContent(); }
function filterSet(k, v)  { S.filter[k] = v; renderListContent(); }
function setSort(col) {
  if (S.sort === col + '_desc') S.sort = col + '_asc'; else S.sort = col + '_desc';
  renderListContent();
}
function toggleView() {
  S.listView = S.listView === 'cards' ? 'table' : 'cards';
  renderListContent();
}

function getYears(cases) {
  return [...new Set(cases.map(c => (c.entryDate || '').substring(0,4)).filter(Boolean))].sort().reverse();
}

function applyFiltersSort(cases) {
  let list = cases.filter(c => {
    const st = caseStatus(c);
    if (S.listTab === 'db'        && st !== 'published')  return false;
    if (S.listTab === 'pending'   && st !== 'pending')    return false;
    if (S.listTab === 'open'      && st !== 'open')       return false;
    if (S.listTab === 'discarded' && st !== 'discarded')  return false;
    const q = S.filter.search;
    if (q && !(c.asset||'').toLowerCase().includes(q) && !(c.authorName||'').toLowerCase().includes(q)) return false;
    if (S.filter.timeframe !== 'all' && c.timeframe !== S.filter.timeframe) return false;
    if (S.filter.year !== 'all' && (c.entryDate||'').substring(0,4) !== S.filter.year) return false;
    return true;
  });

  const dir = S.sort.endsWith('_asc') ? 1 : -1;
  const col = S.sort.replace(/_asc$|_desc$/, '');
  list.sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'created': va = a.createdAt;    vb = b.createdAt;    break;
      case 'asset':   va = (a.asset||'').toLowerCase(); vb = (b.asset||'').toLowerCase(); break;
      case 'author':  va = (a.authorName||'').toLowerCase(); vb = (b.authorName||'').toLowerCase(); break;
      case 'entry':   va = a.entryDate||''; vb = b.entryDate||''; break;
      case 'rr':      va = calcRR(a) ?? -Infinity; vb = calcRR(b) ?? -Infinity; break;
      default:        va = a.entryDate||''; vb = b.entryDate||'';
    }
    return va < vb ? dir : va > vb ? -dir : 0;
  });
  return list;
}

function sortTh(col, label) {
  const active = S.sort.startsWith(col);
  const arrow  = !active ? '↕' : S.sort.endsWith('_asc') ? '↑' : '↓';
  return `<th class="${active?'sorted':''}" data-action="sort" data-id="${col}">${label}<span class="sort-arr">${arrow}</span></th>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso.includes('T') ? iso : iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
}

// ── Fila reutilizable para las 3 listas no-DB ────────────────────
function makeCaseRow(c, context) {
  const ops    = c.operations || [];
  const lastOp = ops.length ? ops[ops.length-1] : null;
  const pos    = positionState(c);
  const rr     = calcRR(c);

  let right = '';
  if (context === 'open') {
    right = `
      <div style="text-align:right">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase">En posición</div>
        <div style="font-weight:700">${num(pos.totalShares,2)} acc.</div>
      </div>
      <button class="btn btn-ghost btn-xs">Editar →</button>`;
  } else if (context === 'pending') {
    right = `
      <div style="text-align:right">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase">R:R</div>
        <div style="font-weight:800;font-size:15px" class="${rr!=null?cls(rr):''}">${fmtRR(rr)}</div>
      </div>
      <button class="btn btn-xs" style="background:rgba(79,126,247,.15);color:var(--accent);border:1px solid rgba(79,126,247,.4);white-space:nowrap">⏳ Ver →</button>`;
  } else if (context === 'discarded') {
    right = `
      <div style="text-align:right;max-width:180px">
        ${c.discardReason ? `<div style="font-size:11px;color:var(--red);line-height:1.3">${esc(c.discardReason)}</div>` : ''}
      </div>
      <button class="btn btn-ghost btn-xs">Ver →</button>`;
  }

  return `
    <div class="open-row" data-action="open-case" data-id="${c.id}">
      <div class="or-asset">${esc(c.asset)||'—'}</div>
      <div class="or-meta">
        <span class="badge b-blue">${c.timeframe==='semanal'?'Semanal':'Diario'}</span>
        ${c.authorName?`<span class="badge b-blue">${esc(c.authorName)}</span>`:''}
        <span style="color:var(--muted);font-size:12px">Entrada ${fmtDate(c.entryDate)}</span>
        ${lastOp?`<span style="color:var(--muted);font-size:12px">· Últ. op. ${fmtDate(lastOp.date)}</span>`:''}
        ${context==='discarded'&&c.discardedAt?`<span style="color:var(--red);font-size:12px">Descartado ${fmtDate(c.discardedAt)}</span>`:''}
      </div>
      <div class="or-right">${right}</div>
    </div>`;
}

  if (!el) return;
  if (!filtered.length) {
    el.innerHTML = `<div class="no-results">No hay casos que coincidan con los filtros.</div>`;
    return;
  }
  if (S.listView === 'table') el.innerHTML = renderTable(filtered);
  else el.innerHTML = `<div class="grid">${filtered.map(renderCard).join('')}</div>`;
}

function renderCard(c) {
  const pos = positionState(c), rr = calcRR(c);
  const account   = c.accountSize || 10000;
  const pnlPct    = pos.realizedPnL / account * 100;
  const assetPct  = calcAssetReturn(c);
  const imgHTML = c.image
    ? `<img class="cc-img" src="${c.image}" alt="${esc(c.asset)}">`
    : `<div class="cc-no-img">📊</div>`;
  return `
    <div class="case-card" data-action="open-case" data-id="${c.id}">
      ${imgHTML}
      <div class="cc-body">
        <div class="cc-title">
          <span>${esc(c.asset)||'<em style="color:var(--muted)">Sin ticker</em>'}</span>
          <span class="${rr!=null?cls(rr):''}" style="font-size:15px;font-weight:800">${fmtRR(rr)}</span>
        </div>
        <div class="cc-meta">
          <span class="badge b-blue">${c.timeframe==='semanal'?'Semanal':'Diario'}</span>
          ${c.authorName?`<span class="badge b-blue">${esc(c.authorName)}</span>`:''}
          ${c.entryDate?`<span class="badge b-amber">${(c.entryDate||'').substring(0,4)}</span>`:''}
        </div>
        <div class="cc-stats">
          <div class="mini-stat">
            <span class="mini-label">Entrada</span>
            <span class="mini-val" style="font-size:12px">${fmtDate(c.entryDate)}</span>
          </div>
          <div class="mini-stat">
            <span class="mini-label">R:R</span>
            <span class="mini-val ${rr!=null?cls(rr):''}">${fmtRR(rr)}</span>
          </div>
          <div class="mini-stat">
            <span class="mini-label">% Cartera</span>
            <span class="mini-val ${pnlPct?cls(pnlPct):''}">${pct(pnlPct)}</span>
          </div>
          ${assetPct!=null?`<div class="mini-stat">
            <span class="mini-label">% Activo</span>
            <span class="mini-val ${cls(assetPct)}">${pct(assetPct)}</span>
          </div>`:''}
        </div>
      </div>
    </div>`;
}

function renderTable(cases) {
  const rows = cases.map(c => {
    const rr = calcRR(c);
    const pos = positionState(c);
    const account = c.accountSize || 10000;
    const pnlPct  = pos.realizedPnL / account * 100;
    const assetPct = calcAssetReturn(c);
    return `
      <tr data-action="open-case" data-id="${c.id}">
        <td>${(c.entryDate||'').substring(0,4)||'—'}</td>
        <td><strong>${esc(c.asset)||'—'}</strong></td>
        <td>${fmtDate(c.entryDate)}</td>
        <td><span class="badge b-blue">${c.timeframe==='semanal'?'Semanal':'Diario'}</span></td>
        <td class="${rr!=null?cls(rr):''}" style="font-weight:800;font-size:15px">${fmtRR(rr)}</td>
        <td class="${cls(pnlPct)}" style="font-weight:700">${pct(pnlPct)}</td>
        <td class="${assetPct!=null?cls(assetPct):''}" style="font-weight:700">${assetPct!=null?pct(assetPct):'—'}</td>
        <td>${esc(c.authorName)||'<span style="color:var(--muted)">—</span>'}</td>
        <td>${fmtDate(c.createdAt)}</td>
        <td><button class="btn btn-ghost btn-xs" data-action="open-case" data-id="${c.id}" data-stop="1">Ver →</button></td>
      </tr>`;
  }).join('');

  return `
    <table class="cases-table">
      <thead><tr>
        ${sortTh('entry','Año / Fecha Entrada')}
        ${sortTh('asset','Activo')}
        <th>Fecha Entrada</th>
        <th>Temporalidad</th>
        ${sortTh('rr','Ratio R:R')}
        <th>% Cartera</th>
        <th>% Activo</th>
        ${sortTh('author','Autor')}
        ${sortTh('created','Fecha Creación')}
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Position tracker ──────────────────────────────────────────────
function posTrackerHTML(pos, c) {
  const rr = c ? calcRR(c) : null, risk = c ? calcInitialRisk(c) : null;
  return `
    <div class="pt-item"><span class="pt-label">Acciones en posición</span><span class="pt-val">${num(pos.totalShares,2)}</span></div>
    <div class="pt-item"><span class="pt-label">Precio Medio</span><span class="pt-val">${pos.avgCost?eur(pos.avgCost,false):'—'}</span></div>
    ${(()=>{ const acc=c?.accountSize||10000, pp=pos.realizedPnL/acc*100;
      return `<div class="pt-item"><span class="pt-label">% Cartera</span><span class="pt-val ${cls(pos.realizedPnL)}">${pct(pp)}</span></div>`; })()}
    <div class="pt-item"><span class="pt-label">Ratio R:R</span><span class="pt-val ${rr!=null?cls(rr):''}">${fmtRR(rr)}</span></div>
    ${risk!=null?`<div class="pt-item"><span class="pt-label">Riesgo Inicial (1R)</span><span class="pt-val" style="color:var(--red)">${eur(risk,false)}</span></div>`:''}`;
}

// ── Operations ────────────────────────────────────────────────────
function renderOps(c, pos, locked = false) {
  const ops = c.operations || [];
  if (!ops.length) return `<div style="color:var(--muted);font-size:13px;padding:4px 0">Aún no hay operaciones.</div>`;

  return ops.map((op, i) => {
    const before = positionState(c, i), after = positionState(c, i+1);
    let pnl = null;
    if ((op.type==='partial_exit'||op.type==='final_exit') && +op.price>0 && +op.shares>0)
      pnl = (+op.price - before.avgCost) * +op.shares;

    const typeInfo = {
      partial_exit: { cls:'t-exit',  lbl:'🟡 Salida Parcial',    sharesLbl:'Acciones vendidas'  },
      add:          { cls:'t-add',   lbl:'🔵 Suma de Posición',   sharesLbl:'Acciones compradas' },
      final_exit:   { cls:'t-final', lbl:'🔴 Salida Final',       sharesLbl:'Acciones vendidas'  },
    }[op.type];

    const risk = calcInitialRisk(c);
    const opRR = (pnl!=null&&risk) ? pnl/risk : null;

    const finalShares = before.totalShares;
    if (op.type==='final_exit' && finalShares>0) op.shares = parseFloat(finalShares.toFixed(4));

    const sharesField = (op.type==='final_exit' || locked)
      ? `<div class="fg"><label>${typeInfo.sharesLbl}</label>
           <input type="text" readonly value="${num(op.shares||finalShares||0,4)}"
             style="color:${op.type==='final_exit'?'var(--amber)':'inherit'}"></div>`
      : `<div class="fg"><label>${typeInfo.sharesLbl}</label>
           <input type="number" value="${op.shares||''}" step="0.5" placeholder="Nº acciones"
             data-action="update-op-shares" data-id="${op.id}"></div>`;

    const dateField  = locked
      ? `<div class="fg"><label>Fecha</label><input type="text" readonly value="${fmtDate(op.date)}"></div>`
      : `<div class="fg"><label>Fecha</label><input type="date" value="${op.date||''}" data-action="update-op-date" data-id="${op.id}"></div>`;

    const priceField = locked
      ? `<div class="fg"><label>Precio (€)</label><input type="text" readonly value="${op.price?eur(op.price,false):'—'}"></div>`
      : `<div class="fg"><label>Precio (€)</label><input type="number" value="${op.price||''}" step="0.01" placeholder="Precio" data-action="update-op-price" data-id="${op.id}"></div>`;

    const addNote = op.type==='add'
      ? `<div class="vela-note" style="border-color:rgba(79,126,247,.25);background:rgba(79,126,247,.06);color:var(--accent)">ℹ️ Suma a <strong>riesgo 0</strong> — el stop inicial ya está en break-even</div>`
      : '';
    const velaNote = op.type==='partial_exit'
      ? `<div class="vela-note">⏰ Regla: sacar el 50% en la <strong>5ª vela ${c.timeframe==='semanal'?'semanal':'diaria'}</strong> tras el evento</div>`
      : '';

    return `
      <div class="op-card ${typeInfo.cls}" id="op-${op.id}">
        <div class="op-hdr">
          <span class="op-lbl">${typeInfo.lbl}</span>
          ${!locked?`<button class="btn btn-ghost btn-xs" data-action="delete-op" data-id="${op.id}">✕ Borrar</button>`:''}
        </div>
        <div class="fgrid">
          ${dateField}${priceField}${sharesField}
          ${pnl!=null?`<div class="fg"><label>P&amp;G Calculado</label>
            <input type="text" readonly value="${eur(pnl)}" style="color:${pnl>=0?'var(--green)':'var(--red)'}"></div>`:''}
          ${opRR!=null?`<div class="fg"><label>R obtenido</label>
            <input type="text" readonly value="${fmtRR(opRR)}" style="color:${opRR>=0?'var(--green)':'var(--red)'}"></div>`:''}
          <div class="fg"><label>Posición tras operación</label>
            <input type="text" readonly value="${num(after.totalShares,2)} acc.${after.totalShares>0?' @ '+eur(after.avgCost,false):' (cerrada)'}">
          </div>
        </div>
        ${addNote}${velaNote}
      </div>`;
  }).join('');
}

// ── Summary ───────────────────────────────────────────────────────
function renderSummary(c, pos) {
  const ops = c.operations || [];
  const adds = ops.filter(o=>o.type==='add'), exits = ops.filter(o=>o.type==='partial_exit');
  const hasFinal = ops.some(o=>o.type==='final_exit');
  const invested = (+c.entryPrice||0)*(+c.entryShares||0) + adds.reduce((s,a)=>s+(+a.price||0)*(+a.shares||0),0);
  const account = c.accountSize??10000, pnlPct = pos.realizedPnL/account*100;
  const assetPct = calcAssetReturn(c);
  const ir = calcInitialRisk(c), rr = calcRR(c);

  return `
    <div class="summary-grid">
      <div class="sum-stat">
        <span class="sum-label">Estado</span>
        <span class="sum-val" style="font-size:16px">${hasFinal?'🔴 Cerrado':'🟢 Abierto'}</span>
      </div>
      <div class="sum-stat">
        <span class="sum-label">Ratio R:R Total</span>
        <span class="sum-val ${rr!=null?cls(rr):'neu'}" style="font-size:26px">${fmtRR(rr)}</span>
        ${ir!=null?`<span class="sum-sub">Riesgo inicial (1R): ${eur(ir,false)}</span>`:''}
      </div>
      <div class="sum-stat">
        <span class="sum-label">% Rentabilidad Cartera</span>
        <span class="sum-val ${cls(pos.realizedPnL)}" style="font-size:26px">${pct(pnlPct)}</span>
        <span class="sum-sub">sobre cuenta de ${eur(account,false)}</span>
      </div>
      ${assetPct!=null?`<div class="sum-stat">
        <span class="sum-label">% Rentabilidad Activo</span>
        <span class="sum-val ${cls(assetPct)}" style="font-size:26px">${pct(assetPct)}</span>
        <span class="sum-sub">desde entrada hasta salida ponderada</span>
      </div>`:''}
      <div class="sum-stat">
        <span class="sum-label">Capital Invertido</span>
        <span class="sum-val neu" style="font-size:17px">${eur(invested,false)}</span>
      </div>
      <div class="sum-stat">
        <span class="sum-label">Posición Abierta</span>
        <span class="sum-val neu" style="font-size:17px">${num(pos.totalShares,2)} acc.</span>
        ${pos.totalShares>0?`<span class="sum-sub">@ ${eur(pos.avgCost,false)} promedio</span>`:''}
      </div>
      <div class="sum-stat"><span class="sum-label">Salidas Parciales</span><span class="sum-val neu" style="font-size:17px">${exits.length}</span></div>
      <div class="sum-stat"><span class="sum-label">Sumas</span><span class="sum-val neu" style="font-size:17px">${adds.length}</span></div>
    </div>`;
}

function refreshOps() {
  collectFormValues();
  const c = S.editing, pos = positionState(c);
  const pt = document.getElementById('pos-tracker');

function collectFormValues() {
  const c = S.editing;
  c.asset       = document.getElementById('f-asset')?.value?.trim() ?? '';
  c.authorName  = document.getElementById('f-author')?.value?.trim() ?? '';
  c.accountSize = parseFloat(document.getElementById('f-account')?.value) || 10000;
  c.timeframe   = document.getElementById('f-timeframe')?.value ?? 'semanal';
  c.notes       = document.getElementById('f-notes')?.value?.trim() ?? '';
  saveDefaultAuthor(c.authorName);
  c.entryDate   = document.getElementById('f-entry-date')?.value ?? '';
  c.entryPrice  = parseFloat(document.getElementById('f-entry-price')?.value) || '';
  c.entrySL     = parseFloat(document.getElementById('f-entry-sl')?.value) || '';
  c.entryShares = parseFloat(document.getElementById('f-entry-shares')?.value) || '';
  c.updatedAt   = new Date().toISOString();
  if (c.entryPrice && c.entrySL)
    c.entrySharesCalc = sharesFormula(c.accountSize, c.entryPrice, c.entrySL);
}

function saveCase() {
  collectFormValues();
  const c = S.editing;
  // Auto-route: si es un caso abierto y ya tiene salida final → Pte. Validación
  let msg = '✅ Caso guardado';
  if (!S.adminMode && caseStatus(c) === 'open' && isClosed(c)) {
    c.status = 'pending';
    msg = '✅ Guardado y enviado a Pte. Validación (tiene salida final)';
  }
  const idx = S.cases.findIndex(x => x.id === c.id);
  if (idx >= 0) S.cases[idx] = c; else S.cases.unshift(c);
  persist();
  firestoreSave(c);
  S.adminMode = false;
  toast(msg);
  render();
}

function deleteCase() {
  showModal({
    title: '🗑 Eliminar caso',
    body: '¿Eliminar este caso? No se puede deshacer.',

      S.cases = S.cases.filter(x => x.id !== id);
      persist(); S.view = 'list'; S.editing = null; S.adminMode = false;
      firestoreDelete(id);
      toast('🗑 Caso eliminado'); render();

  });
}

function exportData() {
  const data = { version: 1, exportedAt: new Date().toISOString(), cases: S.cases };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `casos-estudio-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`📤 ${S.cases.length} casos exportados`);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = ''; // reset so same file can be re-imported
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const incoming = Array.isArray(data) ? data : (data.cases || []);
      if (!incoming.length) throw new Error('No se encontraron casos en el archivo');
      const news = incoming.filter(c => !S.cases.find(x => x.id === c.id));
      const updates = incoming.filter(c =>  S.cases.find(x => x.id === c.id));
      const msg = [
        news.length    ? `${news.length} nuevos` : '',
        updates.length ? `${updates.length} actualizados` : '',
      ].filter(Boolean).join(', ');
      showModal({
        title: '📥 Importar datos',
        body: `Se importarán <strong>${incoming.length} casos</strong> (${msg}). Los existentes se actualizarán.`,
        confirmLabel: 'Importar',
        onConfirm: () => {
          incoming.forEach(c => {
            const idx = S.cases.findIndex(x => x.id === c.id);
            if (idx >= 0) S.cases[idx] = c; else S.cases.push(c);
          });
          persist();
          if (db) {
            const batch = db.batch();
            incoming.forEach(c => batch.set(db.collection('cases').doc(c.id), c));
            batch.commit().catch(e => console.warn('Import Firestore batch error:', e));
          }
          toast(`✅ Importación completada: ${msg}`);
          render();
        }
      });
    } catch(err) {
      toast('❌ Error: ' + err.message, 'err');
    }
  };
  r.readAsText(file);
}

function handleImg(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async ev => {
    const compressed = await compressImage(ev.target.result);
    S.editing.image = compressed;
    const z = document.getElementById('drop-zone');
    if (z) z.innerHTML = `<img src="${compressed}" alt="gráfico" data-action="zoom-img" style="cursor:zoom-in">
      <p style="margin-top:8px;color:var(--muted);font-size:12px">Click en la imagen para ampliar · Click fuera para cambiar</p>`;
  };
  r.readAsDataURL(file);
}
function removeImg() { S.editing.image = null; render(); }

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="lightbox-close">✕</span><img src="${src}" alt="gráfico ampliado">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}

// Compress image to keep Firestore documents small (<900 KB)
function compressImage(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      const MAX = 1400;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', 0.78));
    };
    img.src = dataUrl;
  });
}

function onEntryChange() {
  const price = parseFloat(document.getElementById('f-entry-price')?.value);
  const sl    = parseFloat(document.getElementById('f-entry-sl')?.value);
  const acc   = parseFloat(document.getElementById('f-account')?.value) || 10000;
  const calcEl = document.getElementById('f-shares-calc');
  const hintEl = document.getElementById('entry-hint');
  if (price > 0 && sl > 0) {
    const calc = sharesFormula(acc, price, sl);
    if (calcEl) calcEl.value = num(calc, 3);
    if (hintEl) { hintEl.style.display='block'; hintEl.textContent=sharesHintText(acc,price,sl); }
    if (S.editing) S.editing.entrySharesCalc = calc;
    const sharesEl = document.getElementById('f-entry-shares');
    if (sharesEl && !sharesEl.value) sharesEl.placeholder = `Sugerido: ${Math.floor(calc)} acc.`;
  } else {
    if (calcEl) calcEl.value = '—';
    if (hintEl) hintEl.style.display = 'none';
  }
}
function onAccountChange() { onEntryChange(); }

document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.stop) e.stopPropagation();
  const action = el.dataset.action, id = el.dataset.id||'', param = el.dataset.param||'';
  switch (action) {
    case 'new-case':    newCase(); break;
    case 'open-case':   if(id) openCase(id); break;
    case 'go-back':     goBack(); break;
    case 'save-case':   saveCase(); break;
    case 'delete-case': deleteCase(); break;
    case 'add-op':      addOp(param); break;
    case 'delete-op':   e.stopPropagation(); deleteOp(id); break;
    case 'toggle-view': toggleView(); break;
    case 'remove-img':  e.stopPropagation(); removeImg(); break;
    case 'pick-img':    document.getElementById('img-input')?.click(); break;
    case 'sort':        if(id) setSort(id); break;
    case 'set-tab':     if(id) setListTab(id); break;
    case 'admin-unlock':          adminUnlock(); break;
    case 'exit-admin-mode':       exitAdminMode(); break;
    case 'admin-publish':         adminPublish(); break;
    case 'admin-discard':         adminDiscard(); break;
    case 'admin-move-to-open':    adminMoveToOpen(); break;
    case 'admin-move-to-pending': adminMoveToPending(); break;
    case 'admin-delete':          adminDelete(); break;
    case 'export':       exportData(); break;
    case 'import-pick':  document.getElementById('import-input')?.click(); break;
    case 'zoom-img':     e.stopPropagation(); if(el.src) openLightbox(el.src); break;
  }
});

document.addEventListener('change', function(e) {
  const el = e.target, action = el.dataset.action, id = el.dataset.id||'';
  if (!action) return;
  switch (action) {
    case 'filter-timeframe':  filterSet('timeframe', el.value); break;
    case 'filter-year':       filterSet('year', el.value); break;
    case 'save-author':       saveDefaultAuthor(el.value); break;
    case 'update-op-date':
      { const op = S.editing?.operations?.find(o => o.id === id);
        if (op) op.date = el.value; }
      break;
    case 'update-op-price':   updateOpField(id, 'price', el.value); break;
    case 'update-op-shares':  updateOpField(id, 'shares', el.value); break;
    case 'img-upload':        handleImg({target:el}); break;
    case 'import-file':       importData({target:el}); break;
  }
});

document.addEventListener('input', function(e) {
  const el = e.target, action = el.dataset.action;
  if (!action) return;
  switch (action) {
    case 'filter-search':  filterSearch(el.value); break;
    case 'entry-change':   onEntryChange(); break;
    case 'account-change': onAccountChange(); break;
  }
});
